<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Vasanthapandiyan Rajakumaran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header">
    <div class="left-section">
      <a class="logo" href="index.html">Vasanthapandiyan<span></span></a>
    </div>

    <nav aria-label="Main navigation">
      <a class="nav-item" href="index.html">Home</a>
      <a class="nav-item" href="services.html">Skills</a>
      <a class="nav-item" href="projects.html">Projects</a>
      <a class="nav-item" href="about.html">About</a>
      <a class="nav-item active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="inner-page contact-layout">
    <div class="section-heading">
      <p class="eyebrow">Get in touch</p>
      <h1>Contact Me</h1>
      <p class="description">
        Interested in connecting or discussing an opportunity? Send me a message.
      </p>
    </div>

    <!-- This form needs a form service or server-side handler to send messages. -->
    <form class="contact-form" action="#" method="post">
      <div class="form-row">
        <input type="text" name="name" placeholder="Your name" aria-label="Your name" required>
        <input type="email" name="email" placeholder="Your email" aria-label="Your email" required>
      </div>

      <input type="text" name="subject" placeholder="Subject" aria-label="Subject">
      <textarea name="message" rows="6" placeholder="Your message" aria-label="Your message" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
